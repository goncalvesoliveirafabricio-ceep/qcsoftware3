<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q.C Software - Monitoramento de Máquinas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Aplicação global da fonte Roboto */
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #1d3151 ; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        
        /* Ícone de indústria ao lado do título */
        h1 { margin-bottom: 5px; color: #ecf0f1; font-weight: 700; }
        h1 i { margin-right: 15px; color: #3498db; }
        
        p { color: #a4b0be; margin-top: 0; margin-bottom: 20px; font-weight: 400; }
        
        #banner-alerta { 
            display: none; background: #e74c3c; color: white; padding: 15px; 
            font-size: 22px; font-weight: 700; margin: 15px auto; width: 90%; 
            border-radius: 6px; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            animation: pulso 2s infinite;
        }

        /* Área do Chão de Fábrica - CORRIGIDO (Removido line-height daqui) */
        #mapa-conteiner {
            position: relative;
            width: 1150px;
            height: 840px;
            background: #1d3151;
            margin: 20px auto;
            border: 3px solid #34495e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Container que agrupa o Ícone + Nome da Máquina */
        .maquina-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 110px;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: normal; /* Garante que elementos filhos não herdem espaços indesejados */
        }
        .maquina-container:hover { transform: scale(1.2); z-index: 10; }

        /* O Círculo de Status com o Ícone dentro */
        .maquina-icone {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }

        /* O Texto embaixo do Ícone */
.maquina-nome {
    margin-top: 8px;
    margin-bottom: 15px; /* ADICIONADO: Cria o espaçamento perfeito após a linha do nome */
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 105px;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 8px;
    border-radius: 4px;
    line-height: 1.2;
}

        /* Cores de Status aplicadas ao círculo do ícone */
        .Normal { background: #2ecc71; border: 2px solid #27ae60; }
        .Parado { background: #e74c3c; border: 2px solid #c0392b; animation: piscar 0.8s infinite; box-shadow: 0 0 15px rgba(231, 76, 60, 0.6); }
        .Manutenção { background: #f1c40f; border: 2px solid #f39c12; color: #2c3e50; }

        /* --- ESTILIZAÇÃO DO MODAL --- */
        .modal {
            display: none; 
            position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
        }
        .modal-conteudo {
            background-color: #2c3e50; margin: 10% auto; padding: 30px; 
            border-radius: 10px; width: 450px; text-align: left;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6); border: 1px solid #34495e;
        }
        .modal h2 { margin-top: 0; color: #ecf0f1; font-size: 24px; border-bottom: 2px solid #34495e; padding-bottom: 12px; font-weight: 700; }
        
        .campo-grupo { margin-bottom: 20px; }
        .campo-grupo label { display: block; margin-bottom: 8px; font-size: 15px; color: #bdc3c7; font-weight: 700; }
        
        .campo-grupo input, .campo-grupo textarea { 
            width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #34495e; 
            background: #1e222b; color: white; box-sizing: border-box; font-family: 'Roboto', sans-serif; font-size: 16px;
            line-height: 1.4;
        }
        .campo-grupo input:disabled, .campo-grupo textarea:disabled { color: #95a5a6; background: #252a34; border-color: #2c3e50; }
        
        .botoes-modal { display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; }
        .btn { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 16px; transition: background 0.2s; font-family: 'Roboto', sans-serif; }
        .btn-salvar { background: #e74c3c; color: white; }
        .btn-salvar:hover { background: #c0392b; }
        .btn-cancelar { background: #7f8c8d; color: white; }
        .btn-cancelar:hover { background: #95a5a6; }

        /* Animações */
        @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes pulso { 0% { transform: scale(1); } 50% { transform: scale(1.01); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <h1><i class="fa-solid fa-industry" style="margin-right: 15px; color: #ffffff;"></i>Q.C Software</h1>
    <p>Painel de Controle em Tempo Real das Máquinas</p>
    
    <div id="banner-alerta">🚨 ALERTA! MÁQUINA COM PROBLEMA! </div>
    
    <div id="mapa-conteiner"></div>

    <div id="modal-problema" class="modal">
        <div class="modal-conteudo">
            <h2 id="modal-titulo">Reportar Ocorrência</h2>
            <input type="hidden" id="modal-id-maquina">
            
            <div class="campo-grupo">
                <label>Data / Hora do Registro</label>
                <input type="text" id="modal-data-hora" disabled>
            </div>
            <div class="campo-grupo">
                <label>Colaborador Responsável</label>
                <input type="text" id="modal-colaborador" placeholder="Nome do operador">
            </div>
            <div class="campo-grupo">
                <label>Descrição Detalhada do Problema</label>
                <textarea id="modal-descricao" rows="3" placeholder="Descreva os sintomas ou o código da falha..."></textarea>
            </div>
            
            <div class="botoes-modal">
                <button id="btn-cancelar" class="btn btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button id="btn-acao" class="btn btn-salvar" onclick="salvarOcorrencia()">Gravar Ocorrência</button>
            </div>
        </div>
    </div>

    <audio id="audio-alerta" src="alerta.mp3" loop></audio>

    <script src="app.js"></script>
</body>
</html>
